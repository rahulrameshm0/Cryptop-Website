{% load static %}

<body class="body">
    <section class="login-section">
        <div class="login-container">
            <div class="form-container">
                <form action="" method="POST">
                    <h1 class="login-head">Register</h1>
                    {% csrf_token %}
                    <input class="username" type="text" name="username" id="username" placeholder="Username" required>
                    <input class="email" type="email" name="email" id="email" placeholder="Email" required>
                    <input class="password" type="password" name="password" id="password" placeholder="Password"
                        required>
                    <input class="confirm-password" type="password" name="confirm_password" id="password"
                        placeholder="Confirm Password" required>
                    <a href="{% url 'login' %}" class="f-pass">Already have an account?</a>
                    <button type="submit">Signup</button>

                    {% for message in messages %}
                    {% if messages %}
                    <div class="alert alert-danger" role="alert">
                        {{message}}
                    </div>
                    {% endif %}
                    {% endfor %}
                </form>
            </div>
        </div>
    </section>
